[package]
name = "sa-core"
description = "Foundation of the Subtitle Adder desktop app: localization, settings, appearance, dispatching, diagnostics, undo, subtitle data model and import, model catalog."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Embed every platform's catalogs on every platform (tests of both PlatformPolicy chains, the cross-platform
# screenshot tool). Without it a Windows build embeds Windows + App + EngineKit + DesktopWindows and a macOS build
# embeds App + EngineKit + DesktopMac.
all-catalogs = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
uuid.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
encoding_rs.workspace = true
regex.workspace = true
chrono.workspace = true
zeroize.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
tempfile.workspace = true
