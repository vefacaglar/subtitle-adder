[package]
name = "sa-providers"
description = "Translation providers (C# and Swift file formats), encrypted API-key store with DPAPI / 0600 key-file protectors, model selection."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sa-core.workspace = true
sa-enginekit.workspace = true
sa-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
uuid.workspace = true
parking_lot.workspace = true
aes-gcm.workspace = true
getrandom.workspace = true
zeroize.workspace = true
base64.workspace = true
chrono.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
