[package]
name = "sa-player"
description = "Video player: FFmpeg (ffmpeg-next) decode, cpal audio output, A/V sync, RGBA frames for the UI; playback timeline and session gate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["ffmpeg"]
# The FFmpeg/cpal backend. View models depend on this crate without it (trait + pure types only).
ffmpeg = ["dep:ffmpeg-next", "dep:cpal", "dep:windows", "dep:libc"]

[dependencies]
sa-core.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
ffmpeg-next = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }

# Thread priorities of the player threads (`ffmpeg_backend/priority.rs`): MMCSS / SetThreadPriority on Windows,
# pthread QoS classes on macOS. Direct3D 11 (Windows): the mapped staging ring for D3D11VA frames
# (`ffmpeg_backend/staging.rs`).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
