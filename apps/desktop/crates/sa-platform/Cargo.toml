[package]
name = "sa-platform"
description = "OS integration behind PlatformShell: Windows (single instance, file associations, fonts, chrome, known folders, shell thumbnails) and macOS (open-document events, menu helpers, defaults store, app-bundle paths, SF Symbols, thumbnails)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
# Renders the app icon (mac-ui §13.5, port of scripts/macos/make-icon.swift) for the packaging scripts.
name = "sa-make-icon"
path = "src/bin/make_icon.rs"

[dependencies]
sa-core.workspace = true
parking_lot.workspace = true
rfd.workspace = true
raw-window-handle.workspace = true
chrono.workspace = true
image.workspace = true
regex.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "Win32_Globalization",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Only the objc2 runtime and Core Foundation (no framework binding crates): see src/mac/mod.rs.
objc2.workspace = true
# Completion handlers (NSAlert sheets) and notification blocks; already in the lockfile through rfd/objc2-app-kit.
block2 = "=0.6.2"
core-foundation.workspace = true
libc.workspace = true
