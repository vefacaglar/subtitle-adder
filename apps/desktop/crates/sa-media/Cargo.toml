[package]
name = "sa-media"
description = "Media library index (Windows and macOS backends), Windows encrypted video chunk cache and buffered video stream, quick locations."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sa-core.workspace = true
sa-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
parking_lot.workspace = true
indexmap.workspace = true
subtle.workspace = true
crossbeam-channel.workspace = true
aes-gcm.workspace = true
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true
zeroize.workspace = true
chrono.workspace = true
unicode-normalization.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
core-foundation.workspace = true

[dev-dependencies]
tempfile.workspace = true
