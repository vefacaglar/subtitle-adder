[package]
name = "sa-sync"
description = "Cross-instance state sync: SyncBus trait, C#-compatible named-pipe broker (Windows), in-process bus (macOS)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sa-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
sha2.workspace = true
chrono.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security_Authentication_Identity", "Win32_System_WindowsProgramming"] }

[features]
# Test-only pipe helpers (`win_testing::RawServer`: a raw server instance on the broker's pipe name with a
# caller-supplied SDDL). Enabled for sa-sync's own tests through the dev-dependency on itself; never in the app.
testing = []

[dev-dependencies]
tempfile.workspace = true
sa-sync = { path = ".", features = ["testing"] }
