[package]
name = "sa-profiles"
description = "Profile store: common ProfileStore trait and types; Windows backend (profiles.json v3 + profiles.db), macOS backend (LibraryKit profiles.json v2 vault)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sa-core.workspace = true
sa-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
uuid.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
aes-gcm.workspace = true
pbkdf2.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
zeroize.workspace = true
base64.workspace = true
chrono.workspace = true
unicode-normalization.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
rusqlite.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_SystemInformation", "Win32_Security_Authentication_Identity", "Win32_System_Diagnostics_Debug", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
