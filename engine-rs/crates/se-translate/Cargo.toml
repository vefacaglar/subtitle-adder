[package]
name = "se-translate"
description = "Subtitle translation: CTranslate2 (MADLAD, NLLB) and llama.cpp / external OpenAI-compatible LLMs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
cuda = ["ct2rs/cuda-dynamic-loading"]

[dependencies]
se-core.workspace = true
se-text.workspace = true
se-models.workspace = true
ureq.workspace = true
url.workspace = true
regex.workspace = true
fancy-regex.workspace = true
unicode-normalization.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
rand.workspace = true
tokenizers.workspace = true
tempfile.workspace = true
sentencepiece.workspace = true
anyhow.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
ct2rs = { workspace = true, features = ["whisper", "mkl"] }

[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { workspace = true, features = ["whisper", "accelerate"] }

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true
