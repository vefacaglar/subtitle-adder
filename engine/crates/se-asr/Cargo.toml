[package]
name = "se-asr"
description = "Speech-to-text: faster-whisper port on CTranslate2 and onnx-asr models on ONNX Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# GPU build: CTranslate2 with dynamically loaded CUDA 12 libraries.
cuda = ["ct2rs/cuda-dynamic-loading"]

[dependencies]
se-core.workspace = true
se-text.workspace = true
se-audio.workspace = true
se-models.workspace = true
ort.workspace = true
ndarray.workspace = true
rustfft.workspace = true
realfft.workspace = true
tokenizers.workspace = true
hound.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
flate2 = { workspace = true, features = ["zlib"] }

# Same CPU backends as the Python ctranslate2 wheel (and se-translate): MKL on Intel CPUs, oneDNN for SGEMM/int8
# elsewhere (without oneDNN, int8 is unavailable on AMD CPUs), and on Windows Intel OpenMP (see build.rs). oneDNN
# only links with the static CRT through engine/cmake/static-crt-toolchain.cmake (set in .cargo/config.toml).
[target.'cfg(windows)'.dependencies]
ct2rs = { workspace = true, features = ["whisper", "mkl", "dnnl", "openmp-runtime-intel"] }

[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
ct2rs = { workspace = true, features = ["whisper", "mkl", "dnnl"] }

[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { workspace = true, features = ["whisper", "accelerate"] }

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true
