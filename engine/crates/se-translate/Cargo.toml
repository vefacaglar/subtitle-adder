[package]
name = "se-translate"
description = "Subtitle translation: CTranslate2 (MADLAD, NLLB) and llama.cpp / external OpenAI-compatible LLMs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
cuda = ["ct2rs/cuda-dynamic-loading"]

[dependencies]
se-core.workspace = true
se-text.workspace = true
se-models.workspace = true
ureq.workspace = true
url.workspace = true
regex.workspace = true
fancy-regex.workspace = true
unicode-normalization.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
rand.workspace = true
tokenizers.workspace = true
tempfile.workspace = true
sentencepiece.workspace = true
anyhow.workspace = true

# The same CPU backends as se-asr and the Python ctranslate2 wheel: MKL on Intel CPUs, oneDNN for SGEMM/int8
# elsewhere (without it int8 is unavailable on AMD CPUs, and ruy gives different beams and is ~3x slower), and on
# Windows Intel OpenMP (see build.rs). oneDNN only links with the static CRT when CMAKE_TOOLCHAIN_FILE points at
# engine/cmake/static-crt-toolchain.cmake.
[target.'cfg(windows)'.dependencies]
ct2rs = { workspace = true, features = ["whisper", "mkl", "dnnl", "openmp-runtime-intel"] }

[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
ct2rs = { workspace = true, features = ["whisper", "mkl", "dnnl"] }

[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { workspace = true, features = ["whisper", "accelerate"] }

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true
