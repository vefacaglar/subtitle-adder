[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.6"
edition = "2024"
license = "MIT"
rust-version = "1.89"
publish = false

[workspace.dependencies]
# Internal crates
se-core = { path = "crates/se-core" }
se-text = { path = "crates/se-text" }
se-audio = { path = "crates/se-audio" }
se-models = { path = "crates/se-models" }
se-asr = { path = "crates/se-asr" }
se-diarize = { path = "crates/se-diarize" }
se-translate = { path = "crates/se-translate" }

# Native bindings (only in the crates that need them)
# ct2rs features are set per target in the crates (mkl on Windows/Linux x86_64, accelerate on macOS).
ct2rs = { version = "0.10.4", default-features = false }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std", "ndarray"] }
ffmpeg-next = "8.1"
libloading = "0.8.9"

# Pure Rust
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ryu = "1.0.23"
sha2 = "0.10.9"
hex = "0.4"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "gzip"] }
url = "2.5.8"
regex = "1.13.1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
sentencepiece = "0.13.2"
tempfile = "3"
filetime = "0.2.29"
dunce = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9.5"
rand_chacha = "0.9"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.11"
thiserror = "2.0.21"
anyhow = "1.0.104"
ndarray = "0.17"
rustfft = "6.4.1"
realfft = "3"
hound = "3.5.1"
glob = "0.3"

# Process guards (llama-server cleanup on signals / engine exit)
libc = "0.2.191"
windows-sys = "0.61.2"

# Test helpers
serial_test = "3"
