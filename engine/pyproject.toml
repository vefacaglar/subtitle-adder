[project]
name = "subtitle-engine"
version = "0.1.0"
description = "Subtitle Adder engine: audio extraction, speech-to-text, sentence segmentation, subtitle generation"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "av>=12",
    "faster-whisper>=1.1",
    "numpy>=2.4.6",
    "onnx-asr[cpu,hub]>=0.12.0",
    "sentencepiece>=0.2.2",
    "sherpa-onnx>=1.12",
    "tokenizers>=0.23.3",
]

[project.scripts]
subtitle-engine = "subtitle_engine.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = ["pytest>=8"]
# NVIDIA GPU support for faster-whisper on Windows/Linux (CUDA 12 cuBLAS + cuDNN 9 runtime DLLs): uv sync --group cuda
cuda = [
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that download and run real models (pytest -m slow)"]
addopts = "-m 'not slow'"

[tool.uv]
# Newer nvidia-cublas-cu12 releases ship Linux wheels only; make the resolver pick versions that also install on Windows.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
