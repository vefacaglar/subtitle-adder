[project]
name = "subtitle-engine"
version = "0.1.0"
description = "Subtitle Adder motoru: videodan ses ayırma, speech-to-text, cümle çıkarma, altyazı üretme"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "av>=12",
    "faster-whisper>=1.1",
    "onnx-asr[cpu,hub]>=0.12.0",
    "sentencepiece>=0.2.2",
    "tokenizers>=0.23.3",
]

[project.scripts]
subtitle-engine = "subtitle_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: model indirip gerçek model çalıştıran testler (pytest -m slow)"]
addopts = "-m 'not slow'"
