[project]
name = "subtitle-engine"
version = "0.1.0"
description = "Subtitle Adder motoru: videodan ses ayırma, speech-to-text, cümle çıkarma, altyazı üretme"
requires-python = ">=3.11"
dependencies = [
    "av>=12",
    "faster-whisper>=1.1",
]

[project.scripts]
subtitle-engine = "subtitle_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: model indirip gerçek STT çalıştıran testler (pytest -m slow)"]
addopts = "-m 'not slow'"
