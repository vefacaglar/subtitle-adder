name: Build and Release

# Builds macOS (SwiftUI app + bundled Rust engine -> .dmg & .zip) and Windows (Rust/Slint app + bundled Rust engine -> .zip).
# Triggered on pushes to main, version tag pushes (v*), or manually via workflow_dispatch.
#
# Optional macOS signing & notarization repository secrets:
#   MAC_CERTIFICATE_P12_BASE64   Base64-encoded Developer ID Application .p12 certificate
#   MAC_CERTIFICATE_PASSWORD     Password for the .p12 certificate
#   APPLE_API_KEY_ID             App Store Connect API Key ID
#   APPLE_API_ISSUER             App Store Connect API Issuer ID
#   APPLE_API_KEY_P8             App Store Connect API private key (.p8 content or base64)
#
# When signing/notarization secrets are absent (or notarization fails), the workflow still succeeds and packages
# an ad-hoc signed / unvalidated macOS build so artifacts and releases are never blocked.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version or tag (e.g. 1.0.1 or v1.0.1). Leave empty to use the repo VERSION file."
        required: false
        type: string
        default: ""
      create_release:
        description: "Publish packages to a GitHub Release"
        required: false
        type: boolean
        default: true
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      app_version: ${{ steps.meta.outputs.app_version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute version and release flags
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CREATE_RELEASE: ${{ inputs.create_release }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          read_repo_version() {
            local v=""
            if [ -f VERSION ]; then
              v="$(tr -d '[:space:]' < VERSION)"
            fi
            if [ -z "$v" ] && [ -f apps/desktop/Cargo.toml ]; then
              v="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' apps/desktop/Cargo.toml | head -n 1)"
            fi
            if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
              v="1.0.0"
            fi
            printf '%s' "$v"
          }

          resolve_free_version() {
            local base="$1"
            local existing_tags=""
            existing_tags="$(git ls-remote --tags origin 'refs/tags/v*' 2>/dev/null || true)"

            tag_conflicts() {
              local candidate="v$1"
              local direct_sha peeled_sha target_sha
              direct_sha="$(printf '%s\n' "$existing_tags" | awk -v ref="refs/tags/${candidate}" '$2 == ref {print $1; exit}')"
              if [ -z "$direct_sha" ]; then
                return 1
              fi
              peeled_sha="$(printf '%s\n' "$existing_tags" | awk -v ref="refs/tags/${candidate}^{}" '$2 == ref {print $1; exit}')"
              target_sha="${peeled_sha:-$direct_sha}"
              if [ "$target_sha" = "$GITHUB_SHA" ]; then
                return 1
              fi
              return 0
            }

            local core="${base%%-*}"
            core="${core%%+*}"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$core"
            major="${major:-1}"
            minor="${minor:-0}"
            patch="${patch:-0}"

            local candidate="$base"
            if tag_conflicts "$candidate"; then
              while true; do
                patch=$((patch + 1))
                candidate="${major}.${minor}.${patch}"
                if ! tag_conflicts "$candidate"; then
                  break
                fi
              done
            fi
            printf '%s' "$candidate"
          }

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            should_release="true"
            draft="true"
            if [[ "$version" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw_ver="$(printf '%s' "${INPUT_VERSION:-}" | xargs)"
            if [ -n "$raw_ver" ]; then
              version="${raw_ver#v}"
              tag="v${version}"
            else
              base_ver="$(read_repo_version)"
              version="$(resolve_free_version "$base_ver")"
              tag="v${version}"
            fi
            if [ "${INPUT_PRERELEASE:-false}" = "true" ] || [[ "$version" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
            should_release="${INPUT_CREATE_RELEASE:-true}"
            draft="${INPUT_DRAFT:-true}"
          else
            base_ver="$(read_repo_version)"
            version="$(resolve_free_version "$base_ver")"
            tag="v${version}"
            should_release="true"
            draft="true"
            if [[ "$version" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
          fi

          # CFBundleShortVersionString in Info.plist expects numeric X.Y(.Z).
          app_version="${version%%-*}"
          if [[ ! "$app_version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            app_version="1.0.0"
          fi

          {
            echo "version=$version"
            echo "app_version=$app_version"
            echo "tag=$tag"
            echo "draft=$draft"
            echo "prerelease=$prerelease"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

          echo "version=$version app_version=$app_version tag=$tag draft=$draft prerelease=$prerelease should_release=$should_release"

  macos:
    name: macOS (arm64)
    needs: prepare
    runs-on: macos-26
    outputs:
      macos_signing_status: ${{ steps.assets.outputs.signing_status }}
    steps:
      - uses: actions/checkout@v6
      # The Rust engine: package-macos.sh runs fetch-runtime.sh (sherpa-onnx 2.0.1), cargo build --release -p se-cli
      # and stage-runtime.sh (copies Homebrew's FFmpeg dylibs into engine/dist and rewrites their install names).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: FFmpeg 8 (Homebrew)
        run: |
          brew install ffmpeg@8 pkgconf
          ffmpeg_prefix="$(brew --prefix ffmpeg@8)"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"

      - name: Setup signing and notarization
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }

          has_cert=false
          if [ -n "$(trim "${MAC_CERTIFICATE_P12_BASE64:-}")" ] && [ -n "${MAC_CERTIFICATE_PASSWORD:-}" ]; then
            has_cert=true
          fi

          has_notary=false
          if [ -n "$(trim "${APPLE_API_KEY_ID:-}")" ] && [ -n "$(trim "${APPLE_API_ISSUER:-}")" ] && [ -n "$(trim "${APPLE_API_KEY_P8:-}")" ]; then
            has_notary=true
          fi

          SIGN_IDENTITY="-"
          KEYCHAIN_PATH=""

          if [ "$has_cert" = true ]; then
            CERT_PATH="$RUNNER_TEMP/certificate.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            KEYCHAIN_PASS="$(openssl rand -hex 24)"

            printf '%s' "$MAC_CERTIFICATE_P12_BASE64" | tr -d '[:space:]' | base64 -D > "$CERT_PATH"
            chmod 600 "$CERT_PATH"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

            existing_keychains=()
            while IFS= read -r line; do
              kc="$(echo "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')"
              [ -n "$kc" ] && existing_keychains+=("$kc")
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"

            SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application:/ {print $2; exit}')"
            if [ -z "$SIGN_IDENTITY" ]; then
              SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Apple Development:|Mac Developer:|Developer ID/ {print $2; exit}')"
            fi
            if [ -z "$SIGN_IDENTITY" ]; then
              echo "::warning::No code-signing identity found in imported .p12 certificate; falling back to ad-hoc signing."
              SIGN_IDENTITY="-"
            else
              echo "Using signing identity: $SIGN_IDENTITY"
            fi
            rm -f "$CERT_PATH"
          else
            echo "::notice::MAC_CERTIFICATE_P12_BASE64 / MAC_CERTIFICATE_PASSWORD not set; building with ad-hoc signature (unvalidated)."
          fi

          if [ "$has_notary" = true ] && [ "$SIGN_IDENTITY" != "-" ]; then
            KEY_ID_CLEAN="$(trim "$APPLE_API_KEY_ID")"
            ISSUER_CLEAN="$(trim "$APPLE_API_ISSUER")"
            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID_CLEAN}.p8"

            if [[ "$APPLE_API_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
              if [[ "$APPLE_API_KEY_P8" != *$'\n'* && "$APPLE_API_KEY_P8" == *'\n'* ]]; then
                printf '%b\n' "$APPLE_API_KEY_P8" > "$NOTARY_KEY_PATH"
              else
                printf '%s\n' "$APPLE_API_KEY_P8" > "$NOTARY_KEY_PATH"
              fi
            else
              printf '%s' "$APPLE_API_KEY_P8" | tr -d '[:space:]' | base64 -D > "$NOTARY_KEY_PATH"
            fi
            chmod 600 "$NOTARY_KEY_PATH"
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
            echo "NOTARY_KEY_ID=$KEY_ID_CLEAN" >> "$GITHUB_ENV"
            echo "NOTARY_ISSUER=$ISSUER_CLEAN" >> "$GITHUB_ENV"
          elif [ "$has_notary" = true ]; then
            echo "::warning::Apple API key secrets are set, but no Developer ID certificate was imported; skipping notarization."
          else
            echo "::notice::APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_API_KEY_P8 not set; skipping notarization."
          fi

          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package
        env:
          MAKE_DMG: "1"
          NOTARY_ALLOW_FAILURE: "1"
          NOTARY_STATUS_FILE: ${{ runner.temp }}/macos-signing-status.txt
          VERSION: ${{ needs.prepare.outputs.app_version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package-macos.sh

      - name: Prepare macOS release assets
        id: assets
        run: |
          set -euo pipefail
          PKG_VERSION="${{ needs.prepare.outputs.version }}"
          DMG_OUT="build/Subtitle-Adder-${PKG_VERSION}-macos-arm64.dmg"
          ZIP_OUT="build/Subtitle-Adder-${PKG_VERSION}-macos-arm64.zip"
          mv "build/Subtitle Adder.dmg" "$DMG_OUT"
          ditto -c -k --keepParent "build/Subtitle Adder.app" "$ZIP_OUT"
          status="$(cat "${{ runner.temp }}/macos-signing-status.txt" 2>/dev/null || echo "adhoc")"
          echo "signing_status=$status" >> "$GITHUB_OUTPUT"
          echo "macOS signing status: $status"
          ls -lh "$DMG_OUT" "$ZIP_OUT"

      - name: Cleanup signing credentials
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "${NOTARY_KEY_PATH:-}" ]; then
            rm -f "$NOTARY_KEY_PATH"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Subtitle-Adder-${{ needs.prepare.outputs.version }}-macos-arm64
          path: |
            build/Subtitle-Adder-*.dmg
            build/Subtitle-Adder-*.zip

  windows:
    name: Windows (x64)
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      # scripts/package-desktop-windows.ps1 builds the Rust desktop app (apps/desktop, against the FFmpeg 8.1 SDK) and
      # the Rust engine (fetch-runtime.ps1: sherpa-onnx 2.0.1, FFmpeg 8.1 SDK; cargo build --release -p se-cli;
      # stage-runtime.ps1), ships the LGPL FFmpeg DLLs next to SubtitleAdder.exe (fetched when missing) and zips the
      # folder. Build tools: MSVC + CMake + Ninja from the preinstalled Visual Studio (msvc-dev-cmd), libclang from the
      # preinstalled LLVM, nuget.exe for intel-onemkl-prebuild.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> ../../t
            apps/desktop -> ../../../t
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - uses: nuget/setup-nuget@v3
      - name: Build environment
        run: |
          # Short target dir outside the checkout (MAX_PATH in the CMake-built oneDNN/CTranslate2 and in cl.exe builds of
          # the app's C dependencies); shared by both workspaces and matching rust-cache.
          "CARGO_TARGET_DIR=$(Split-Path -Parent $env:GITHUB_WORKSPACE)\t" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CC=cl" >> $env:GITHUB_ENV
          "CXX=cl" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      # The app is built before the engine and needs the FFmpeg SDK first (fetch-runtime exports FFMPEG_DIR).
      - name: Runtimes
        working-directory: engine
        run: scripts/fetch-runtime.ps1
      - name: Package
        run: scripts/package-desktop-windows.ps1 -Zip -Version "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: SubtitleAdder-${{ needs.prepare.outputs.version }}-win-x64
          path: build/desktop/SubtitleAdder-*-win-x64.zip

  # One job publishes the release so the two platform builds cannot race into two releases.
  release:
    name: GitHub Release
    needs: [prepare, macos, windows]
    if: >-
      !cancelled() &&
      needs.prepare.outputs.should_release == 'true' &&
      (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        env:
          MACOS_STATUS: ${{ needs.macos.outputs.macos_signing_status }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## Subtitle Adder ${VERSION}"
            echo ""
            if [ "$MACOS_RESULT" = "success" ]; then
              echo "### macOS (Apple Silicon)"
              case "$MACOS_STATUS" in
                signed-notarized)
                  echo "- **Status:** Signed with Apple Developer ID and notarized."
                  echo "- **Install:** Open \`Subtitle-Adder-${VERSION}-macos-arm64.dmg\` and drag **Subtitle Adder** to Applications, or extract \`Subtitle-Adder-${VERSION}-macos-arm64.zip\`."
                  ;;
                signed-unnotarized)
                  echo "- **Status:** Signed with Apple Developer ID, **not notarized (unvalidated by Gatekeeper)**."
                  echo "- **Install:** On first launch, right-click **Subtitle Adder.app** and choose **Open**, or run:"
                  echo "  \`xattr -dr com.apple.quarantine \"/Applications/Subtitle Adder.app\"\`"
                  ;;
                *)
                  echo "- **Status:** **Unsigned / ad-hoc signed (unvalidated)** — Apple Developer ID / notarization secrets were not configured."
                  echo "- **Install:** Gatekeeper will warn on first launch. Right-click **Subtitle Adder.app** and choose **Open**, or run:"
                  echo "  \`xattr -dr com.apple.quarantine \"/Applications/Subtitle Adder.app\"\`"
                  ;;
              esac
              echo ""
            fi
            if [ "$WINDOWS_RESULT" = "success" ]; then
              echo "### Windows (x64)"
              echo "- **Status:** Unsigned build (SmartScreen may warn on first run; choose **More info** -> **Run anyway**)."
              echo "- **Install:** Extract \`SubtitleAdder-${VERSION}-win-x64.zip\` anywhere and run \`Subtitle Adder\\SubtitleAdder.exe\`."
              echo ""
            fi
            echo "---"
            echo "Models are downloaded locally on first use."
          } > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Subtitle Adder ${{ needs.prepare.outputs.version }}
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: false
          files: |
            dist/Subtitle-Adder-*.dmg
            dist/Subtitle-Adder-*.zip
            dist/SubtitleAdder-*-win-x64.zip
