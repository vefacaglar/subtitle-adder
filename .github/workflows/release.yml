name: Release

# Pushing a tag like v0.2.0 builds the macOS app (.dmg) and the Windows app (.zip) and attaches both to one draft
# GitHub release. The macOS build is ad-hoc signed (no Apple Developer ID yet), so Gatekeeper warns on first open;
# the Windows build is unsigned unless a code-signing certificate is configured, so SmartScreen may warn.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Package
        run: MAKE_DMG=1 scripts/package-macos.sh
      - name: Rename dmg
        run: mv "build/Subtitle Adder.dmg" "build/Subtitle-Adder-$VERSION-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Subtitle-Adder-${{ env.VERSION }}-macos-arm64
          path: build/Subtitle-Adder-*.dmg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-dev' }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Package
        run: scripts/package-windows.ps1 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleAdder-${{ env.VERSION }}-win-x64
          path: build/SubtitleAdder-*-win-x64.zip

  # One job creates the draft so the two builds cannot race into two releases. Whichever build succeeded is attached.
  release:
    needs: [macos, windows]
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            dist/Subtitle-Adder-*.dmg
            dist/SubtitleAdder-*-win-x64.zip
          body: |
            macOS (Apple Silicon) build. It is ad-hoc signed, so on first launch right-click the app and choose Open,
            or run `xattr -dr com.apple.quarantine "/Applications/Subtitle Adder.app"`.

            Windows (x64) build: unzip anywhere and run `Subtitle Adder\SubtitleAdder.exe`. If SmartScreen warns,
            choose More info, then Run anyway.

            Models are downloaded on first use.
