name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: uv sync --locked --no-group cuda
      # Slow tests download real models; they are excluded by default (pyproject addopts).
      - run: uv run --no-group cuda pytest -q

  macos-app:
    name: macOS app
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      # The dev-engine lookup test expects uv (the app runs the engine through `uv run` in development).
      - uses: astral-sh/setup-uv@v6
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Package.resolved') }}
      - run: swift build
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            # Surface failing tests as annotations on the run summary.
            grep -E "✘|error:" test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

  windows-app:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      # The dev-engine lookup tests expect uv (the app runs the engine through `uv run` in development).
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/windows/**/*.csproj', 'apps/windows/**/*.props') }}
      - run: dotnet build SubtitleAdder.slnx -c Debug -nologo
      - name: dotnet test
        run: |
          dotnet test SubtitleAdder.slnx -c Debug --no-build -nologo --logger "trx;LogFilePrefix=results" --results-directory TestResults
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface failing tests as annotations on the run summary.
            Get-ChildItem TestResults -Filter *.trx | ForEach-Object {
              $trx = [xml](Get-Content $_.FullName)
              $trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed' | Select-Object -First 20 | ForEach-Object {
                $msg = ($_.Output.ErrorInfo.Message -replace '\r?\n', ' ')
                Write-Output "::error::$($_.testName): $msg"
              }
            }
          }
          exit $code
