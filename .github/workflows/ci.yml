name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: engine
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      # Outside the checkout and short: the CMake-built oneDNN/CTranslate2 objects hit MAX_PATH on Windows under a
      # deep target dir. rust-cache below points at the same folder.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../t
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> ../../t

      # Native runtimes. sherpa-onnx 2.0.1 (C API + onnxruntime) on every OS comes from fetch-runtime, which also
      # exports SUBTITLE_ENGINE_SHERPA_DIR (and FFMPEG_DIR where it provides FFmpeg) through GITHUB_ENV.
      - name: Runtimes (Linux; FFmpeg 8.1 from BtbN, apt only has older FFmpeg)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-runtime.sh
      - name: Runtimes (macOS; FFmpeg 8 from Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@8 pkgconf
          ffmpeg_prefix="$(brew --prefix ffmpeg@8)"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"
          bash scripts/fetch-runtime.sh
      - name: Runtimes (Windows; FFmpeg 8.1 SDK from BtbN)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/fetch-runtime.ps1
      # Windows: CMake + Ninja + cl from the preinstalled Visual Studio (the static-CRT toolchain file in
      # .cargo/config.toml is tested with Ninja), libclang from the preinstalled LLVM (ffmpeg-sys-next bindgen),
      # nuget.exe for the MKL / Intel OpenMP packages of intel-onemkl-prebuild.
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: nuget/setup-nuget@v3
        if: runner.os == 'Windows'
      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CC=cl" >> $env:GITHUB_ENV
          "CXX=cl" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # -j 2: the oneDNN/MKL debug rlibs are huge and parallel rustc processes run out of memory.
      # Tests needing real models skip themselves (or are #[ignore]d); no model is downloaded.
      - name: cargo test
        if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast -j 2
      # pwsh on Windows: in bash, Git's /usr/bin/link would shadow MSVC's link.exe from msvc-dev-cmd.
      - name: cargo test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --workspace --no-fail-fast -j 2

  desktop:
    # The pure-Rust desktop app (apps/desktop): Slint UI (fluent tree on Windows, cupertino tree on macOS), the stores
    # and view models, the FFmpeg + cpal player. The comparisons with the former C# app read frozen C# outputs
    # (crates/*/tests/fixtures/csharp) and run here without .NET; only the real-engine tests (ENGINE_E2E=1) are opt-in
    # and do not. Two parts are bound to the Windows account that recorded the C# data and print SKIPPED on any other
    # account, so on these runners: the DPAPI remembered-session restore in sa-profiles' win_fixtures (the rest of
    # each dump is still compared) and sa-sync's .NET default-scope check.
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Short and outside the checkout: long paths break cl.exe (ring, rusqlite's bundled SQLite) on Windows.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../td
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> ../../../td
      # FFmpeg 8.1: the pinned BtbN SDK on Windows (fetch-runtime exports FFMPEG_DIR and puts its bin on PATH),
      # Homebrew's ffmpeg 8 on macOS (found through pkg-config).
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: engine
        run: scripts/fetch-runtime.ps1 -Only ffmpeg
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@8 pkgconf
          ffmpeg_prefix="$(brew --prefix ffmpeg@8)"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # pwsh on Windows: in bash, Git's /usr/bin/link would shadow MSVC's link.exe from msvc-dev-cmd.
      - name: cargo build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --workspace --all-targets -j 3
      - name: cargo test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --workspace --exclude sa-player --no-fail-fast -j 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p sa-player --no-fail-fast -j 1 -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: cargo build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --workspace --all-targets -j 3
      - name: cargo test (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo test --workspace --exclude sa-player --no-fail-fast -j 3
          cargo test -p sa-player --no-fail-fast -j 1 -- --test-threads=1
      # The other tree as a look check: the cupertino tree also compiles on Windows and the fluent one on macOS.
      - name: Other UI tree builds
        shell: pwsh
        run: |
          $env:SA_UI_PLATFORM = if ($IsWindows) { 'mac' } else { 'win' }
          $env:CARGO_TARGET_DIR = "$env:CARGO_TARGET_DIR-other"
          cargo build -p sa-app --features all-catalogs --bin sa-shot -j 3

  macos-app:
    name: macOS app
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v6
      # The dev-engine lookup tests only launch engine/dist when it is staged, so no engine build is needed here.
      - run: swift --version
      - uses: actions/cache@v5
        with:
          path: apps/macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Package.resolved') }}
      - run: swift build
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            # Surface failing tests as annotations on the run summary.
            grep -E "✘|error:" test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
